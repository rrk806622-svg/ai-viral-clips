
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Viral Clips</title>
<style>
body {
  background:#101426;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
}
.container {
  max-width:650px;
  margin:50px auto;
  background:#1b2340;
  padding:25px;
  border-radius:15px;
}
input {
  width:90%;
  padding:15px;
  border-radius:8px;
  border:0;
  margin:15px 0;
}
button {
  padding:15px 25px;
  background:#7657ff;
  color:white;
  border:0;
  border-radius:8px;
  cursor:pointer;
}
#status {margin-top:25px;}
</style>
</head>
<body>
<div class="container">
<h1>AI Viral Clips</h1>
<p>Paste YouTube Video URL</p>

<input id="youtubeUrl"
placeholder="Paste YouTube URL">

<br>

<button onclick="startClipping()">
Create Viral Clips
</button>

<div id="status"></div>
<div id="results"></div>
</div>

<script>
const API_URL = "YOUR_CLOUD_BACKEND_URL";

async function startClipping() {
 const url = document.getElementById("youtubeUrl").value.trim();
 const status = document.getElementById("status");
 const results = document.getElementById("results");

 results.innerHTML = "";

 if (!/^https?:\/\/(www\.)?(youtube\.com|youtu\.be)\//i.test(url)) {
   status.innerText = "Please enter a valid YouTube URL.";
   return;
 }

 if (API_URL === "YOUR_CLOUD_BACKEND_URL") {
   status.innerText = "Cloud Backend connect karna baki hai.";
   return;
 }

 status.innerText = "Starting AI processing...";

 try {
   const response = await fetch(API_URL + "/clips", {
     method: "POST",
     headers: {"Content-Type": "application/json"},
     body: JSON.stringify({url})
   });

   if (!response.ok) throw new Error("Processing request failed");

   const data = await response.json();
   status.innerText = "Processing Job ID: " + data.job_id;
 } catch (error) {
   status.innerText = "Error: " + error.message;
 }
}
</script>
</body>
</html>
