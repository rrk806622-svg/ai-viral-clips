
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Viral Clips</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111b;color:white;font-family:Arial}
header{text-align:center;padding:25px}
h1{color:#a78bfa}
main{max-width:650px;margin:20px auto;padding:22px;background:#202132;border-radius:16px}
input,select,button{width:100%;padding:13px;margin:9px 0;border-radius:8px;font-size:16px}
input,select{background:#111322;color:white;border:1px solid #555}
button{background:#8057ee;color:white;border:0;font-weight:bold;cursor:pointer}
video{width:100%;margin-top:15px;background:#000}
#status{color:#b9a4ff;overflow-wrap:anywhere}
.clip{padding:12px;background:#111322;margin:12px 0;border-radius:8px}
a{color:#b9a4ff}
</style>
</head>
<body>
<header>
<h1>AI Viral Clips</h1>
<p>Create short clips from your own videos</p>
</header>
<main>
<h2>1. YouTube Video Link</h2>
<input type="url" id="youtube" placeholder="Paste YouTube video URL here">
<button id="check">Check YouTube Link</button>
<p id="ytstatus"></p>
<p>Note: Link checking only. Upload your own video file below to create clips.</p>

<h2>2. Select Your Video</h2>
<input type="file" id="file" accept="video/*">
<video id="video" controls></video>

<h2>3. Number of Clips</h2>
<select id="count">
<option value="5">5 Clips</option>
<option value="10">10 Clips</option>
</select>

<h2>4. Clip Duration</h2>
<select id="duration">
<option value="30">30 Seconds</option>
<option value="60">60 Seconds</option>
<option value="90">90 Seconds</option>
</select>

<h2>5. Video Format</h2>
<select id="format">
<option value="vertical">9:16 Shorts (Vertical)</option>
<option value="horizontal">16:9 Landscape</option>
</select>

<button id="make">Generate Clips</button>
<p id="status">Select your own video to begin.</p>
<div id="results"></div>
</main>
<script>
const fileInput=document.getElementById("file");
const video=document.getElementById("video");
const status=document.getElementById("status");
const results=document.getElementById("results");
let videoURL="";

document.getElementById("check").onclick=()=>{
 const url=document.getElementById("youtube").value.trim();
 const out=document.getElementById("ytstatus");
 try{
  const u=new URL(url);
  const valid=(u.hostname==="youtube.com"||u.hostname==="www.youtube.com"||u.hostname==="m.youtube.com"||u.hostname==="youtu.be");
  if(!valid)throw new Error();
  out.textContent="YouTube link accepted. Upload your own video file below to create clips.";
 }catch(e){
  out.textContent="Please enter a valid YouTube link.";
 }
};

fileInput.addEventListener("change",()=>{
 const file=fileInput.files[0];
 if(!file)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(file);
 video.src=videoURL;
 results.innerHTML="";
 status.textContent="Video loaded. Choose your clip settings.";
});

function waitForSeek(){
 return new Promise(resolve=>video.addEventListener("seeked",resolve,{once:true}));
}

function recordClip(start,duration,vertical){
 return new Promise(async(resolve,reject)=>{
  const width=vertical?720:1280;
  const height=vertical?1280:720;
  const canvas=document.createElement("canvas");
  canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext("2d");
  let animation;

  const draw=()=>{
   const vw=video.videoWidth,vh=video.videoHeight;
   if(vw&&vh){
    const scale=Math.max(width/vw,height/vh);
    const sw=width/scale,sh=height/scale;
    ctx.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,width,height);
   }
   if(!video.paused&&!video.ended)animation=requestAnimationFrame(draw);
  };

  try{
   video.pause();
   video.currentTime=start;
   await waitForSeek();
   const canvasStream=canvas.captureStream(30);
   const sourceStream=video.captureStream();
   const stream=new MediaStream([
    ...canvasStream.getVideoTracks(),
    ...sourceStream.getAudioTracks()
   ]);
   const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]
    .find(t=>MediaRecorder.isTypeSupported(t));
   if(!mime)throw new Error("WebM unsupported");
   const chunks=[];
   const recorder=new MediaRecorder(stream,{mimeType:mime});
   recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
   recorder.onerror=()=>reject(new Error("Recording failed"));
   recorder.onstop=()=>{
    cancelAnimationFrame(animation);
    stream.getTracks().forEach(t=>t.stop());
    resolve(new Blob(chunks,{type:mime}));
   };
   recorder.start();
   draw();
   await video.play();
   const finish=()=>{
    if(video.currentTime>=start+duration||video.ended){
     video.pause();
     if(recorder.state==="recording")recorder.stop();
    }else requestAnimationFrame(finish);
   };
   finish();
  }catch(e){reject(e);}
 });
}

document.getElementById("make").onclick=async()=>{
 if(!video.src||!video.duration){
  status.textContent="Please select your own video first.";return;
 }
 const count=Number(document.getElementById("count").value);
 const duration=Number(document.getElementById("duration").value);
 const vertical=document.getElementById("format").value==="vertical";
 if(video.duration<duration){
  status.textContent="Video is shorter than selected duration.";return;
 }
 results.innerHTML="";
 const maxStart=video.duration-duration;
 for(let i=0;i<count;i++){
  status.textContent="Creating clip "+(i+1)+" of "+count+"...";
  try{
   const start=maxStart*i/(count-1);
   const blob=await recordClip(start,duration,vertical);
   const url=URL.createObjectURL(blob);
   const box=document.createElement("div");
   box.className="clip";
   const link=document.createElement("a");
   link.href=url;link.download="clip-"+(i+1)+".webm";
   link.textContent="Download Clip "+(i+1);
   box.appendChild(link);results.appendChild(box);
  }catch(e){
   status.textContent="Could not create clip. Try another video.";return;
  }
 }
 video.pause();
 status.textContent="All clips are ready!";
};
</script>
</body>
</html>
